<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uwts Lyrics 설정</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f12; color: #f2f2f5;
         font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }
  main { width: min(480px, calc(100vw - 32px)); box-sizing: border-box; padding: 32px; border-radius: 24px; background: rgba(255,255,255,.06);
         border: 1px solid rgba(255,255,255,.14); box-shadow: inset 1px 1px 0 rgba(255,255,255,.3), 0 8px 32px rgba(0,0,0,.4);
         backdrop-filter: blur(24px) saturate(1.4); }
  h1 { margin: 0 0 20px; font-size: 22px; }
  h2 { margin: 0 0 8px; font-size: 16px; }
  section + section { margin-top: 24px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.1); }
  p { margin: 0 0 16px; line-height: 1.6; color: #c9cad3; font-size: 15px; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #f2f2f5; color: #0f0f12;
           font-size: 16px; font-weight: 700; cursor: pointer; }
  button:focus-visible, .switch input:focus-visible + .track { outline: 3px solid #8ab4ff; outline-offset: 2px; }
  .switch { display: flex; align-items: center; gap: 16px; min-height: 48px; cursor: pointer; font-size: 15px; line-height: 1.5; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track { flex: none; position: relative; width: 52px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.18);
           border: 1px solid rgba(255,255,255,.2); transition: background .2s; }
  .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
                  background: #f2f2f5; transition: transform .2s; }
  .switch input:checked + .track { background: #4f8cff; }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .hint { font-size: 13px; color: #9a9ba6; margin: 8px 0 0; }
  .status { margin: 12px 0 0; min-height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Uwts Lyrics 설정</h1>
  <section aria-labelledby="h-grant">
    <h2 id="h-grant">가사 소스 접근 허용</h2>
    <p>더 많은 곡의 가사를 빠르게 찾으려면 NetEase 음악(music.163.com)과 YouTube 정보 요청 권한이 필요해요. 가사와 곡 정보를 가져오는 데만 써요.</p>
    <button id="grant" type="button">허용하기</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
  <section aria-labelledby="h-kr">
    <h2 id="h-kr">개인용 소스</h2>
    <label class="switch">
      <input id="kr" type="checkbox" role="switch" aria-describedby="kr-hint">
      <span class="track" aria-hidden="true"></span>
      <span>개인용 국내 가사 소스 (벅스·지니·멜론) 사용 — 공개 배포 시 비활성화</span>
    </label>
    <p id="kr-hint" class="hint">신곡도 싱크 가사를 찾을 수 있어요. 비공식 경로라 언제든 동작이 멈출 수 있어요.</p>
    <p id="kr-status" class="status" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="grant.js"></script>
</body>
</html>
