<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uwts Lyrics 권한</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f12; color: #f2f2f5;
         font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }
  main { max-width: 440px; padding: 32px; border-radius: 24px; background: rgba(255,255,255,.06);
         border: 1px solid rgba(255,255,255,.14); box-shadow: inset 1px 1px 0 rgba(255,255,255,.3), 0 8px 32px rgba(0,0,0,.4); }
  h1 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 0 0 20px; line-height: 1.6; color: #c9cad3; font-size: 15px; }
  button { width: 100%; height: 48px; border: 0; border-radius: 14px; background: #f2f2f5; color: #0f0f12;
           font-size: 16px; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
  #status { margin: 16px 0 0; min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <h1>가사 소스 접근 허용</h1>
  <p>더 많은 곡의 가사를 빠르게 찾으려면 NetEase 음악(music.163.com)과 YouTube 정보 요청 권한이 필요해요. 가사와 곡 정보를 가져오는 데만 써요.</p>
  <button id="grant" type="button">허용하기</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="grant.js"></script>
</body>
</html>
