name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag must match manifest version
        run: test "v$(node -p "require('./public/manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run pack
      - name: Publish release with the zip
        run: gh release create "$GITHUB_REF_NAME" release/uwts-lyrics-*.zip --title "Uwts Lyrics $GITHUB_REF_NAME" --notes-file docs/INSTALL.txt
        env:
          GH_TOKEN: ${{ github.token }}
